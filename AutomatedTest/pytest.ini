# Makes the harness runnable from anywhere, which is what PyCharm needs:
# its run configurations default to the project root, one level above here.
[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Readable failures. The stack and conformance tests compare tuples, and the
# default truncation hides exactly the values you need to see.
addopts =
    -v
    --tb=short
    -ra
